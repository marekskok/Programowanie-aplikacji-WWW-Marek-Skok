<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add new product</title>
    <script src="index.js" defer></script>
</head>
<body>
    <h1>Add new product</h1>
    
    <form id="productForm" method="post" enctype="multipart/form-data" novalidate autocomplete="off">
        
        <fieldset>
            <legend>Personal info</legend>
            <div class="form-group">
                <label for="fullName">Full name:</label>
                <input type="text" id="fullName" name="fullName" value="John" autofocus autocomplete="on">
            </div>
            <div class="form-group">
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" placeholder="e.g. kowalski@example.con" required autocomplete="on">
            </div>
            <div class="form-group">
                <label for="phone">Phone number:</label>
                <input type="text" value="+48" readonly style="width: 35px; margin-right: 5px; text-align: center;">
                <input type="tel" id="phone" name="phone" placeholder="123 456 789">
            </div>
            <div class="form-group">
                <input type="checkbox" id="createAccount" name="createAccount" class="no-margin" checked>
                <label for="createAccount" class="inline-label">Create an account</label>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" pattern=".{8,}" title="Min. 8 characters" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Product info</legend>
            <div class="form-group">
                <label for="productType">Product type:</label>
                <select id="productType" name="productType">
                    <option value="" disabled selected hidden>&mdash; choose &mdash;</option>
                    <optgroup label="Electronics">
                        <option value="phone">Phone</option>
                        <option value="laptop">Laptop</option>
                    </optgroup>
                    <optgroup label="Fashion">
                        <option value="clothing">Clothing</option>
                        <option value="footwear">Footwear</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group">
                <label for="price">Price:</label>
                <input type="range" id="price" name="price" min="0" max="1000" value="500" oninput="document.getElementById('priceDisplay').innerText = this.value"> 
                <label id="priceDisplay" style="font-size: 18px; margin-left: 10px;">500</label>
            </div>
            <div class="form-group align-top">
                <label for="description">Description:</label>
                <textarea id="description" name="description" rows="3" cols="35" placeholder="Short product description..."></textarea>
            </div>
            <div class="form-group">
                <label for="maker">Maker:</label>
                <input list="makers" id="maker" name="maker" placeholder="e.g. Apple">
                <datalist id="makers">
                    <option value="Apple">
                    <option value="Samsung">
                </datalist>
            </div>
            <br>
            <div class="form-group">
                <label style="width: auto; margin-right: 15px;">Warranty period:</label>
            </div>
            <div class="form-group">
                <input type="radio" id="warranty12" name="warranty" value="12" class="no-margin" checked>
                <label for="warranty12" class="inline-label">12 months</label>
                <input type="radio" id="warranty24" name="warranty" value="24">
                <label for="warranty24" class="inline-label">24 months</label>
            </div>
            <div class="form-group">
                <label for="photo" style="width: 140px;">Product photo:</label>
                <input type="file" id="photo" name="photo" style="border: none; padding: 0;">
            </div>
            <div class="form-group">
                <label for="purchasedDate">Purchased date:</label>
                <input type="text" id="purchasedDate" name="purchasedDate" value="15.10.2025" style="width: 100px;">
            </div>
            <div class="form-group align-top">
                <label for="tags" style="width: 60px;">Tags:</label>
                <select id="tags" name="tags" multiple size="3">
                    <option value="new">New</option>
                    <option value="used">Used</option>
                    <option value="popular">Popular</option>
                </select>
            </div>
        </fieldset>

        <fieldset>
            <legend>Action</legend>
            <div class="form-group">
                <button type="reset" style="margin-right: 5px;">Reset</button>
                <button type="submit" style="margin-right: 5px;">Submit</button>
                <button type="submit" formnovalidate>Save draft</button>
            </div>
        </fieldset>
    </form>
</body>
</html>
